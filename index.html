<html><head><base href="https://adolfsan99.github.io/web/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo a tu nuevo sitio web</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap');

    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #22e18b;
        font-family: 'Source Code Pro', monospace;
        color: #232323;
    }
    .container {
        text-align: center;
    }
    h1 {
        font-size: 2rem;
        margin-bottom: 20px;
    }
    .loader {
        width: 50px;
        height: 50px;
        border: 5px solid #232323;
        border-top: 5px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .progress {
        width: 200px;
        height: 20px;
        background-color: #1aab6a;
        border-radius: 10px;
        overflow: hidden;
        margin: 20px auto;
    }
    .progress-bar {
        width: 0%;
        height: 100%;
        background-color: #232323;
        transition: width 3s linear;
    }
    .redirect-message {
        opacity: 0;
        transition: opacity 0.5s ease-in;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Redirigiendo al nuevo sitio web</h1>
        <div class="loader"></div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p class="redirect-message">¡Listo! Redirigiendo ahora...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const progressBar = document.querySelector('.progress-bar');
            const redirectMessage = document.querySelector('.redirect-message');

            // Iniciar la animación de la barra de progreso
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 100);

            // Mostrar el mensaje de redirección y redirigir
            setTimeout(() => {
                redirectMessage.style.opacity = '1';
                setTimeout(() => {
                    window.location.href = 'https://adolfsan99.github.io/web/';
                }, 1000);
            }, 3000);
        });
    </script>
</body></html>
